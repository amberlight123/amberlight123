<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 0 800 290" role="img" aria-labelledby="title desc"><title id="title">Alberto Davis — Full Stack Developer</title><desc id="desc">I build web and desktop applications, from data to interface.</desc><style>
.halo{animation:halo 8s ease-in-out infinite}
.glint{animation:glint 12s ease-in-out infinite}
.bars{transform-box:fill-box;transform-origin:left center;animation:reveal 1.4s ease-out both}
.scan{stroke-dasharray:42 800;animation:flow 9s linear infinite}
.arrive{animation:arrive 1.2s ease-out both}
.arrow{animation:nudge 3.8s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes glint{0%,100%{transform:translateX(0);opacity:.35}50%{transform:translateX(270px);opacity:.85}}
@keyframes reveal{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes flow{from{stroke-dashoffset:842}to{stroke-dashoffset:0}}
@keyframes arrive{from{opacity:.65;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.halo,.glint,.bars,.scan,.arrive,.arrow{animation:none;transform:none;opacity:1}.scan{display:none}}
</style><rect width="800" height="290" fill="#000000"/><rect x="24" y="12" width="752" height="264" fill="#02091A" stroke="#032999"/><rect x="24" y="12" width="752" height="3" fill="#0161EA" stroke="none"/><text x="52" y="49" font-family="Consolas,monospace" font-size="17" font-weight="600" fill="#18DCF9">HELLO, I AM</text><text x="48" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" fill="#F4F7FB">Alberto Davis</text><text x="52" y="146" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#9BEAF5">Full Stack Developer</text><text x="52" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#F4F7FB">Thoughtful interfaces.</text><text x="52" y="234" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#F4F7FB">Reliable systems.</text><rect x="52" y="166" width="350" height="1" fill="#032999" stroke="none"/><rect class="glint" x="52" y="165" width="64" height="2" fill="#18DCF9"/><circle class="halo" cx="650" cy="151" r="88" fill="none" stroke="#0161EA" stroke-dasharray="3 12"/><g transform="translate(650 151) rotate(0)"><path d="M 14 -8 L 58 -8 L 76 10 L 48 10 L 68 30 L 55 43 L 23 10 Z" fill="#032999"/><path d="M 32 -8 H 58" stroke="#18DCF9" stroke-width="2"/></g><g transform="translate(650 151) rotate(60)"><path d="M 14 -8 L 58 -8 L 76 10 L 48 10 L 68 30 L 55 43 L 23 10 Z" fill="#0161EA"/><path d="M 32 -8 H 58" stroke="#18DCF9" stroke-width="2"/></g><g transform="translate(650 151) rotate(120)"><path d="M 14 -8 L 58 -8 L 76 10 L 48 10 L 68 30 L 55 43 L 23 10 Z" fill="#032999"/><path d="M 32 -8 H 58" stroke="#18DCF9" stroke-width="2"/></g><g transform="translate(650 151) rotate(180)"><path d="M 14 -8 L 58 -8 L 76 10 L 48 10 L 68 30 L 55 43 L 23 10 Z" fill="#0161EA"/><path d="M 32 -8 H 58" stroke="#18DCF9" stroke-width="2"/></g><g transform="translate(650 151) rotate(240)"><path d="M 14 -8 L 58 -8 L 76 10 L 48 10 L 68 30 L 55 43 L 23 10 Z" fill="#032999"/><path d="M 32 -8 H 58" stroke="#18DCF9" stroke-width="2"/></g><g transform="translate(650 151) rotate(300)"><path d="M 14 -8 L 58 -8 L 76 10 L 48 10 L 68 30 L 55 43 L 23 10 Z" fill="#0161EA"/><path d="M 32 -8 H 58" stroke="#18DCF9" stroke-width="2"/></g></svg>