<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140" role="img" aria-labelledby="title desc"><title id="title">Have a project in mind? Let’s build something useful together.</title><desc id="desc">Have a project in mind? Let’s build something useful together.</desc><style>
.halo{animation:halo 8s ease-in-out infinite}
.glint{animation:glint 12s ease-in-out infinite}
.bars{transform-box:fill-box;transform-origin:left center;animation:reveal 1.4s ease-out both}
@keyframes halo{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes glint{0%,100%{transform:translateX(0);opacity:.35}50%{transform:translateX(270px);opacity:.85}}
@keyframes reveal{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.halo,.glint,.bars{animation:none;transform:none;opacity:1}}
</style><rect width="800" height="140" fill="#000000"/><text x="30" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#F4F7FB">Have a project in mind? Let’s build something useful</text><text x="30" y="71" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#F4F7FB">together.</text></svg>