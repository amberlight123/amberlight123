<svg xmlns="http://www.w3.org/2000/svg" width="800" height="734" viewBox="0 0 800 734" role="img" aria-labelledby="title desc"><title id="title">Portfolio capability self-assessments out of 100: Applied AI 68, UI/UX design 65, networking 60, cybersecurity 60, Scrum 56, Linux 43, Node.js 37.</title><desc id="desc">Original animated chart using existing personal portfolio ratings; no new proficiency values are inferred.</desc><style>
