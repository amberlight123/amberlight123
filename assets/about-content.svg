<svg xmlns="http://www.w3.org/2000/svg" width="800" height="302" viewBox="0 0 800 302" role="img" aria-labelledby="title desc"><title id="title">I’m Alberto Davis, a Full Stack Developer. I build web applications with PHP, MySQL, JavaScript and Python, from the database to the interface. My work spans business websites, booking systems, desktop tools and data analysis. I also explore networking, interface design and cybersecurity fundamentals.</title><desc id="desc">I’m Alberto Davis, a Full Stack Developer. I build web applications with PHP, MySQL, JavaScript and Python, from the database to the interface. My work spans business websites, booking systems, desktop tools and data analysis. I also explore networking, interface design and cybersecurity fundamentals.</desc><style>
.halo{animation:halo 8s ease-in-out infinite}
.glint{animation:glint 12s ease-in-out infinite}
.bars{transform-box:fill-box;transform-origin:left center;animation:reveal 1.4s ease-out both}
.scan{stroke-dasharray:42 800;animation:flow 9s linear infinite}
.arrive{animation:arrive 1.2s ease-out both}
.arrow{animation:nudge 3.8s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes glint{0%,100%{transform:translateX(0);opacity:.35}50%{transform:translateX(270px);opacity:.85}}
@keyframes reveal{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes flow{from{stroke-dashoffset:842}to{stroke-dashoffset:0}}
@keyframes arrive{from{opacity:.65;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.halo,.glint,.bars,.scan,.arrive,.arrow{animation:none;transform:none;opacity:1}.scan{display:none}}
</style><rect width="800" height="302" fill="#000000"/><g class="arrive" style="animation-delay:0.00s"><text x="30" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#F4F7FB">I’m Alberto Davis, a Full Stack Developer. I build web</text><text x="30" y="71" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#F4F7FB">applications with PHP, MySQL, JavaScript and Python, from</text><text x="30" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#F4F7FB">the database to the interface.</text></g><g class="arrive" style="animation-delay:0.09s"><text x="30" y="163" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#F4F7FB">My work spans business websites, booking systems, desktop</text><text x="30" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#F4F7FB">tools and data analysis. I also explore networking,</text><text x="30" y="233" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#F4F7FB">interface design and cybersecurity fundamentals.</text></g><rect x="30" y="290" width="740" height="1" fill="#032999" stroke="none"/><path class="scan" d="M 30 290 h 740" fill="none" stroke="#18DCF9" stroke-width="2" opacity=".8" style="animation-delay:-0s"/></svg>