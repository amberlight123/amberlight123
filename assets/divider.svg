<svg xmlns="http://www.w3.org/2000/svg" width="800" height="110" viewBox="0 0 800 110" role="img" aria-labelledby="title desc"><title id="title">Alberto Davis — NixOS Cyber-Rice</title><desc id="desc">Alberto Davis — NixOS Cyber-Rice</desc><style>
.halo{animation:halo 8s ease-in-out infinite}
.glint{animation:glint 12s ease-in-out infinite}
.bars{transform-box:fill-box;transform-origin:left center;animation:reveal 1.4s ease-out both}
@keyframes halo{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes glint{0%,100%{transform:translateX(0);opacity:.35}50%{transform:translateX(270px);opacity:.85}}
@keyframes reveal{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.halo,.glint,.bars{animation:none;transform:none;opacity:1}}
</style><rect width="800" height="110" fill="#000000"/><rect x="28" y="32" width="744" height="1" fill="#032999" stroke="none"/><text x="28" y="73" font-family="Consolas,monospace" font-size="18" font-weight="600" fill="#F4F7FB">ALBERTO DAVIS</text><text x="489" y="73" font-family="Consolas,monospace" font-size="18" font-weight="400" fill="#18DCF9">NIXOS CYBER-RICE</text></svg>