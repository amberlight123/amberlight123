<svg xmlns="http://www.w3.org/2000/svg" width="600" height="734" viewBox="0 0 600 734" role="img" aria-labelledby="title desc"><title id="title">Tools: DESIGN &amp; PROTOTYPING: Figma · Interface design · Interactive prototypes; AI ASSISTANCE: Claude · Claude Code · AI with Python; WEB &amp; APIs: React · Next.js · Node.js · Vite · FastAPI; DESKTOP &amp; DELIVERY: PySide6 · Npcap · Inno Setup; DATA &amp; INFRASTRUCTURE: MySQL · PostgreSQL · Apache · Azure · Vercel; NETWORKS &amp; SYSTEMS: Linux · TCP/IP · Routing · Switching · Security fundamentals · Network automation; WORKFLOW &amp; COMMUNICATION: Scrum · Data analysis · Technical presentations</title><desc id="desc">Tools: DESIGN &amp; PROTOTYPING: Figma · Interface design · Interactive prototypes; AI ASSISTANCE: Claude · Claude Code · AI with Python; WEB &amp; APIs: React · Next.js · Node.js · Vite · FastAPI; DESKTOP &amp; DELIVERY: PySide6 · Npcap · Inno Setup; DATA &amp; INFRASTRUCTURE: MySQL · PostgreSQL · Apache · Azure · Vercel; NETWORKS &amp; SYSTEMS: Linux · TCP/IP · Routing · Switching · Security fundamentals · Network automation; WORKFLOW &amp; COMMUNICATION: Scrum · Data analysis · Technical presentations</desc><style>
.halo{animation:halo 8s ease-in-out infinite}
.glint{animation:glint 12s ease-in-out infinite}
.bars{transform-box:fill-box;transform-origin:left center;animation:reveal 1.4s ease-out both}
.scan{stroke-dasharray:42 800;animation:flow 9s linear infinite}
.arrive{animation:arrive 1.2s ease-out both}
.arrow{animation:nudge 3.8s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes glint{0%,100%{transform:translateX(0);opacity:.35}50%{transform:translateX(270px);opacity:.85}}
@keyframes reveal{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes flow{from{stroke-dashoffset:842}to{stroke-dashoffset:0}}
@keyframes arrive{from{opacity:.65;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.halo,.glint,.bars,.scan,.arrive,.arrow{animation:none;transform:none;opacity:1}.scan{display:none}}
