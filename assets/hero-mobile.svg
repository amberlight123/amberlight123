<svg xmlns="http://www.w3.org/2000/svg" width="600" height="314" viewBox="0 0 600 314" role="img" aria-labelledby="title desc"><title id="title">Alberto Davis — Full Stack Developer</title><desc id="desc">Alberto Davis — Full Stack Developer</desc><style>
.halo{animation:halo 8s ease-in-out infinite}
.glint{animation:glint 12s ease-in-out infinite}
.bars{transform-box:fill-box;transform-origin:left center;animation:reveal 1.4s ease-out both}
.scan{stroke-dasharray:42 800;animation:flow 9s linear infinite}
.arrive{animation:arrive 1.2s ease-out both}
.arrow{animation:nudge 3.8s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes glint{0%,100%{transform:translateX(0);opacity:.35}50%{transform:translateX(270px);opacity:.85}}
@keyframes reveal{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes flow{from{stroke-dashoffset:842}to{stroke-dashoffset:0}}
@keyframes arrive{from{opacity:.65;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.halo,.glint,.bars,.scan,.arrive,.arrow{animation:none;transform:none;opacity:1}.scan{display:none}}
</style><rect width="600" height="314" fill="#000000"/><rect x="18" y="12" width="564" height="288" fill="#02091A" stroke="#032999"/><rect x="18" y="12" width="564" height="3" fill="#0161EA" stroke="none"/><text x="42" y="49" font-family="Consolas,monospace" font-size="21" font-weight="600" fill="#18DCF9">HELLO, I AM</text><text x="38" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="52" font-weight="700" fill="#F4F7FB">Alberto Davis</text><text x="42" y="157" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#9BEAF5">Full Stack Developer</text><text x="42" y="222" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#F4F7FB">Thoughtful interfaces.</text><text x="42" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#F4F7FB">Reliable systems.</text><rect x="42" y="180" width="350" height="1" fill="#032999" stroke="none"/><rect class="glint" x="42" y="179" width="64" height="2" fill="#18DCF9"/></svg>