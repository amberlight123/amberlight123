<svg xmlns="http://www.w3.org/2000/svg" width="600" height="410" viewBox="0 0 600 410" role="img" aria-labelledby="title desc"><title id="title">Alberto Davis — Full Stack Developer</title><desc id="desc">Alberto Davis — Full Stack Developer</desc><style>
.halo{animation:halo 8s ease-in-out infinite}
.glint{animation:glint 12s ease-in-out infinite}
.bars{transform-box:fill-box;transform-origin:left center;animation:reveal 1.4s ease-out both}
@keyframes halo{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes glint{0%,100%{transform:translateX(0);opacity:.35}50%{transform:translateX(270px);opacity:.85}}
@keyframes reveal{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.halo,.glint,.bars{animation:none;transform:none;opacity:1}}
</style><rect width="600" height="410" fill="#000000"/><rect x="18" y="18" width="564" height="374" fill="#02091A" stroke="#032999"/><rect x="18" y="18" width="564" height="3" fill="#0161EA" stroke="none"/><text x="42" y="69" font-family="Consolas,monospace" font-size="23" font-weight="600" fill="#18DCF9">HELLO, I AM</text><text x="38" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="55" font-weight="700" fill="#F4F7FB">Alberto Davis</text><text x="42" y="187" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="600" fill="#9BEAF5">Full Stack Developer</text><text x="42" y="258" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="400" fill="#F4F7FB">Thoughtful interfaces.</text><text x="42" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="400" fill="#F4F7FB">Reliable systems.</text><text x="42" y="357" font-family="Consolas,monospace" font-size="23" font-weight="400" fill="#C4D0DA">WEB / DESKTOP / DATA</text><rect x="42" y="213" width="350" height="1" fill="#032999" stroke="none"/><rect class="glint" x="42" y="212" width="64" height="2" fill="#18DCF9"/></svg>